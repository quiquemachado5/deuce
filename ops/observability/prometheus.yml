global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: deuce-app
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/deuce_metrics_secret
    static_configs:
      - targets: [web:3000]

  - job_name: deuce-caddy
    metrics_path: /metrics
    static_configs:
      - targets: [caddy:2019]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
