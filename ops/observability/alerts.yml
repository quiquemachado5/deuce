groups:
  - name: deuce-production
    rules:
      - alert: DeuceTargetUnavailable
        expr: up{job=~"deuce-app|deuce-caddy"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} no responde"
          description: "Prometheus no puede consultar {{ $labels.instance }} desde hace dos minutos."

      - alert: DeuceElevatedServerErrors
        expr: sum(rate(caddy_http_requests_total{code=~"5.."}[5m])) / clamp_min(sum(rate(caddy_http_requests_total[5m])), 0.001) > 0.03
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Más del 3 % de respuestas son errores 5xx"
          description: "La proporción de errores del proxy lleva diez minutos por encima del umbral."

      - alert: DeuceProviderReserveReached
        expr: deuce_operational_value{name="providerSafeAvailable"} <= 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "La reserva de llamadas del proveedor está agotada"
          description: "Los procesos de ingestión deben permanecer detenidos hasta el siguiente reinicio de cuota."

      - alert: DeuceBackupStale
        expr: deuce_operational_value{name="backupAgeSeconds"} > 129600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "La última copia verificada supera 36 horas"
          description: "Revisar deuce-backup.service y el remoto configurado."

      - alert: DeuceHostMemoryLow
        expr: deuce_operational_value{name="hostAvailableMemoryBytes"} < 402653184
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "El VPS dispone de menos de 384 MiB"
          description: "Revisar consumo de contenedores antes de que el kernel termine procesos."

      - alert: DeuceRateLimitActive
        expr: sum(increase(caddy_http_requests_total{code="429"}[15m])) > 100
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "La barrera perimetral está rechazando tráfico sostenido"
          description: "Más de cien solicitudes recibieron 429 en los últimos quince minutos."

      - alert: DeuceRepeatedAuthenticationFailures
        expr: sum(increase(deuce_security_events_total{outcome="denied"}[10m])) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Autenticaciones internas rechazadas de forma repetida"
          description: "Revisar los eventos security.auth.denied y el acceso al endpoint afectado."

      - alert: DeucePoorLcpP75
        expr: histogram_quantile(0.75, sum by (route, device, le) (rate(deuce_client_metric_value_bucket{metric="LCP"}[30m]))) > 4000 and on(route, device) sum by (route, device) (increase(deuce_client_metric_value_count{metric="LCP"}[30m])) >= 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "LCP p75 deficiente en {{ $labels.route }} ({{ $labels.device }})"
          description: "La ruta y dispositivo acumulan al menos veinte muestras y superan 4 segundos."

      - alert: DeucePoorTtfbP75
        expr: histogram_quantile(0.75, sum by (route, device, le) (rate(deuce_client_metric_value_bucket{metric="TTFB"}[30m]))) > 1800 and on(route, device) sum by (route, device) (increase(deuce_client_metric_value_count{metric="TTFB"}[30m])) >= 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "TTFB p75 deficiente en {{ $labels.route }} ({{ $labels.device }})"
          description: "La respuesta inicial supera 1,8 segundos con una muestra real suficiente."

      - alert: DeucePoorInpP75
        expr: histogram_quantile(0.75, sum by (route, device, le) (rate(deuce_client_metric_value_bucket{metric="INP"}[30m]))) > 500 and on(route, device) sum by (route, device) (increase(deuce_client_metric_value_count{metric="INP"}[30m])) >= 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "INP p75 deficiente en {{ $labels.route }} ({{ $labels.device }})"
          description: "La interacción supera 500 milisegundos con una muestra real suficiente."

      - alert: DeucePoorClsP75
        expr: histogram_quantile(0.75, sum by (route, device, le) (rate(deuce_client_metric_value_bucket{metric="CLS"}[30m]))) > 0.25 and on(route, device) sum by (route, device) (increase(deuce_client_metric_value_count{metric="CLS"}[30m])) >= 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CLS p75 deficiente en {{ $labels.route }} ({{ $labels.device }})"
          description: "La estabilidad visual supera 0,25 con una muestra real suficiente."

      - alert: DeuceSlowRouteTransitionP75
        expr: histogram_quantile(0.75, sum by (route, device, le) (rate(deuce_client_metric_value_bucket{metric="route-transition"}[30m]))) > 2500 and on(route, device) sum by (route, device) (increase(deuce_client_metric_value_count{metric="route-transition"}[30m])) >= 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Navegación lenta en {{ $labels.route }} ({{ $labels.device }})"
          description: "La transición p75 acumula veinte muestras y supera 2,5 segundos."

      - alert: DeuceSearchZeroResultsBurst
        expr: sum by (tour) (increase(deuce_searches_total{outcome="zero"}[30m])) / clamp_min(sum by (tour) (increase(deuce_searches_total{outcome=~"zero|results"}[30m])), 1) > 0.35 and sum by (tour) (increase(deuce_searches_total{outcome=~"zero|results"}[30m])) >= 30
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Muchas búsquedas {{ $labels.tour }} terminan sin resultado"
          description: "Más del 35 % de las búsquedas recientes no devuelve coincidencias; revisar el índice y los alias."

      - alert: DeuceClientErrorsBurst
        expr: sum(increase(deuce_client_events_total{event=~"client-error|unhandled-rejection"}[15m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Aumento de errores en navegadores reales"
          description: "Se han recibido más de diez errores o promesas rechazadas en quince minutos."

      - alert: DeuceQuotaTelemetryMissing
        expr: absent(deuce_operational_value{name="providerSafeAvailable"})
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No hay telemetría de cuota del proveedor"
          description: "Comprobar la publicación de provider-quota-status antes de autorizar nuevas importaciones. Una métrica ausente no equivale a cuota disponible."

      - alert: DeuceAccessDenialsSurge
        expr: sum(increase(caddy_http_requests_total{code=~"401|403"}[10m])) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Aumento sostenido de accesos rechazados"
          description: "Contrastar logs del proxy con security.auth.denied. No bloquear automáticamente por este aviso."
