name: Production health
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deuce-production-health
  cancel-in-progress: false
jobs:
  monitor:
    if: github.repository == 'quiquemachado5/deuce' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check health and deliver deduplicated incident
        run: node ops/monitor.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
