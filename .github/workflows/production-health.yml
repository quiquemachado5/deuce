name: Production health
on:
  push:
    branches: [main]
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deuce-production-health
  cancel-in-progress: false
jobs:
  monitor:
    if: github.repository == 'quiquemachado5/deuce' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Check health and deliver deduplicated incident
        run: node ops/monitor.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          METRICS_SECRET: ${{ secrets.DEUCE_METRICS_SECRET }}
          DEUCE_MONITOR_URL: ${{ vars.DEUCE_MONITOR_URL }}
          DEUCE_EXPECTED_COMMIT: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.sha || '' }}
