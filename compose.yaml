name: deuce

x-logging: &deuce-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  web:
    image: ${DEUCE_WEB_IMAGE:-deuce-web:local}
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_ORIGIN: ${NEXT_PUBLIC_SITE_ORIGIN}
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
        BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
        DEUCE_SNAPSHOT_MANIFEST_URL: ${DEUCE_SNAPSHOT_MANIFEST_URL:-}
        DEUCE_EXPECTED_SNAPSHOT_COMMIT: ${DEUCE_EXPECTED_SNAPSHOT_COMMIT:-}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.5
    env_file:
      - .env.production
    environment:
      DEUCE_ARCHIVE_DIR: /app/.deuce-archive
      DEUCE_RATE_LIMIT_STORE: sqlite
      DEUCE_RATE_LIMIT_DB: /app/.deuce-archive/.runtime/rate-limits.sqlite
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=1536
    volumes:
      - archive:/app/.deuce-archive
      - next_cache:/app/.next/cache
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    expose:
      - "3000"
    logging: *deuce-logging

  scheduler:
    image: ${DEUCE_WEB_IMAGE:-deuce-web:local}
    user: "1001:1001"
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m
    cpus: 0.75
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DEUCE_INTERNAL_URL: http://web:3000
      DEUCE_ARCHIVE_DIR: /app/.deuce-archive
      DEUCE_SCHEDULER_HEARTBEAT_ONLY: ${DEUCE_SCHEDULER_HEARTBEAT_ONLY:-0}
      DEUCE_SCHEDULER_PIPELINE_DELAY_MS: ${DEUCE_SCHEDULER_PIPELINE_DELAY_MS:-0}
    command: ["node", "/app/ops/oracle/scheduler.mjs"]
    volumes:
      - archive:/app/.deuce-archive
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');const p=(process.env.DEUCE_ARCHIVE_DIR||'/app/.deuce-archive')+'/.scheduler/state.json';const s=JSON.parse(fs.readFileSync(p,'utf8'));if(!s.heartbeatAt||Date.now()-Date.parse(s.heartbeatAt)>180000)process.exit(1)"]
      interval: 60s
      timeout: 5s
      start_period: 2m
      retries: 3
    logging: *deuce-logging

  caddy:
    image: ${DEUCE_CADDY_IMAGE:-ghcr.io/quiquemachado5/deuce-caddy:source-94ccf3d092bdf34ae18a2794bb98f45d7670ccc9614b2ce45285b1c6f58775a6}
    build:
      context: ./ops/oracle
      dockerfile: Dockerfile.caddy
      args:
        RATE_LIMIT_VERSION: 5625512f24f6f59d6f64fb3aafe5eecff0b286db
        DEUCE_CADDY_SOURCE_SHA256: 94ccf3d092bdf34ae18a2794bb98f45d7670ccc9614b2ce45285b1c6f58775a6
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      web:
        condition: service_healthy
    environment:
      DEUCE_HOST: ${DEUCE_HOST:?DEUCE_HOST is required}
      DEUCE_WWW_HOST: ${DEUCE_WWW_HOST:?DEUCE_WWW_HOST is required}
      DEUCE_LEGACY_HOST: ${DEUCE_LEGACY_HOST:?DEUCE_LEGACY_HOST is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    expose:
      - "2019"
    volumes:
      - ./ops/oracle/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DEUCE_LOG_DIR:-/opt/deuce/logs}:/var/log/deuce
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging: *deuce-logging

  prometheus:
    image: prom/prometheus:v3.5.0
    user: "65534:65534"
    restart: unless-stopped
    init: true
    # Compose materializes local secrets inside the container rootfs. Keeping
    # this service read-only makes that copy fail before Prometheus can start:
    # https://github.com/docker/compose/issues/12303
    # The service remains unprivileged, capability-free and unpublished.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.35
    depends_on:
      web:
        condition: service_healthy
      caddy:
        condition: service_healthy
    secrets:
      - deuce_metrics_secret
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=384MB
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "ready", "--url=http://localhost:9090"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *deuce-logging

volumes:
  archive:
  next_cache:
  caddy_data:
  caddy_config:
  prometheus_data:

secrets:
  deuce_metrics_secret:
    environment: METRICS_SECRET
