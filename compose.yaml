name: deuce

x-logging: &deuce-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  web:
    image: ${DEUCE_WEB_IMAGE:-deuce-web:local}
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_ORIGIN: ${NEXT_PUBLIC_SITE_ORIGIN}
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
        DEUCE_SNAPSHOT_MANIFEST_URL: ${DEUCE_SNAPSHOT_MANIFEST_URL:-}
        DEUCE_EXPECTED_SNAPSHOT_COMMIT: ${DEUCE_EXPECTED_SNAPSHOT_COMMIT:-}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.5
    env_file:
      - .env.production
    environment:
      DEUCE_ARCHIVE_DIR: /app/.deuce-archive
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=1536
    volumes:
      - archive:/app/.deuce-archive
      - next_cache:/app/.next/cache
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    expose:
      - "3000"
    logging: *deuce-logging

  scheduler:
    image: ${DEUCE_WEB_IMAGE:-deuce-web:local}
    user: "1001:1001"
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m
    cpus: 0.75
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DEUCE_INTERNAL_URL: http://web:3000
      DEUCE_ARCHIVE_DIR: /app/.deuce-archive
      DEUCE_SCHEDULER_HEARTBEAT_ONLY: ${DEUCE_SCHEDULER_HEARTBEAT_ONLY:-0}
      DEUCE_SCHEDULER_PIPELINE_DELAY_MS: ${DEUCE_SCHEDULER_PIPELINE_DELAY_MS:-0}
    command: ["node", "/app/ops/oracle/scheduler.mjs"]
    volumes:
      - archive:/app/.deuce-archive
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');const p=(process.env.DEUCE_ARCHIVE_DIR||'/app/.deuce-archive')+'/.scheduler/state.json';const s=JSON.parse(fs.readFileSync(p,'utf8'));if(!s.heartbeatAt||Date.now()-Date.parse(s.heartbeatAt)>180000)process.exit(1)"]
      interval: 60s
      timeout: 5s
      start_period: 2m
      retries: 3
    logging: *deuce-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/oracle/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DEUCE_LOG_DIR:-/opt/deuce/logs}:/var/log/deuce
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging: *deuce-logging

volumes:
  archive:
  next_cache:
  caddy_data:
  caddy_config:
